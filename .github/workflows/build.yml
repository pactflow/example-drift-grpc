name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # A repository variable is preferred — the broker URL is not a credential, and
  # leaving it unmasked makes CI failures much easier to diagnose. Falls back to
  # a secret of the same name so the example works either way.
  PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_BASE_URL || secrets.PACT_BROKER_BASE_URL }}
  PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
  GIT_COMMIT: ${{ github.sha }}

jobs:
  verify-and-publish:
    name: Verify with Drift and publish to PactFlow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Drift
        run: |
          wget -O - https://download.pactflow.io/drift/latest/linux-x86_64.tgz | tar xz -C /usr/local/bin
          drift auth login

      - name: Install dependencies and generate gRPC stubs
        run: make proto

      # Verifies the running server against routeguide.proto, then publishes the
      # proto file to PactFlow as a gRPC provider contract together with the
      # Drift verification results — whether verification passed or failed.
      - name: Verify and publish provider contract
        run: GIT_BRANCH=${GITHUB_REF#refs/heads/} make ci

      # The result bundle is the artefact published to PactFlow; keeping a copy
      # makes it possible to inspect exactly what a build reported.
      - name: Upload Drift results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: drift-results
          path: output/results/
          retention-days: 30
